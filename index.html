<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Gamevote</title>
<style>
:root{--bg:#12131c;--card:#1c1e2c;--line:#2c2f44;--ink:#eceef6;--mute:#9a9fb8;--blue:#5b8cff;--yes:#3fcf8e;--later:#f0b24a;--no:#ef6a6a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;margin:0}h2{font-size:1.05rem;margin:26px 0 10px;color:var(--mute);font-weight:600}
button,input{font:inherit;color:inherit}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
label{display:block;font-size:.88rem;color:var(--mute);margin:0 0 4px}
.btn{background:var(--blue);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:.88rem}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.me{display:flex;gap:10px;align-items:center;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--line) center/cover;display:grid;place-items:center;font-weight:700;flex:none}
.av.s{width:26px;height:26px;font-size:.75rem}.av.l{width:96px;height:96px;font-size:2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.steht{border-color:var(--yes)}
.head{display:flex;gap:10px;align-items:center}.head .t{flex:1;min-width:0}
.game{font-size:1.15rem;font-weight:700;margin:0}.sub{color:var(--mute);font-size:.88rem}
.pips{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:7px;border:2px dashed var(--line)}
.pip.on{background:var(--yes);border:2px solid var(--yes)}
.pip.later{background:var(--later);border:2px solid var(--later)}
.count{font-size:.9rem}.steht .count{color:var(--yes);font-weight:600}
.pin{background:var(--bg);border-left:3px solid var(--later);padding:8px 10px;border-radius:6px;margin:10px 0;font-size:.92rem}
.ans{display:flex;gap:8px;margin:10px 0 8px}
.ans button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:600}
.ans button.yes.on{background:var(--yes);border-color:var(--yes);color:#0c2a1d}
.ans button.later.on{background:var(--later);border-color:var(--later);color:#33240a}
.ans button.no.on{background:var(--no);border-color:var(--no);color:#3a1010}
.who{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.w{display:flex;gap:8px;align-items:center;font-size:.9rem}.w .mark{width:10px;height:10px;border-radius:50%;flex:none}
.w .mute{color:var(--mute)}
.row2{display:flex;gap:8px;align-items:flex-start}.row2 input{flex:1;margin:0 0 10px}.row2 .btn{flex:none;min-width:48px;padding:11px 0;margin-bottom:10px}
.push{border-color:var(--blue)}.push p{margin:6px 0 10px}
.stat{margin:0 0 12px}.card .stat:last-child{margin-bottom:0}.stat .line{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.guide{border-color:var(--blue)}.guide p{margin:6px 0 10px}.guide ol{margin:8px 0 12px;padding-left:20px}.guide li{margin:5px 0}
.toast{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));max-width:532px;margin:auto;background:#3a1d24;border:1px solid var(--no);padding:12px;border-radius:10px;z-index:9}
.empty{color:var(--mute);padding:18px 4px}
.head .btn{flex:none}
.btn.danger{background:transparent;border:1px solid var(--no);color:var(--no)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.guide.warn{border-color:var(--later);background:#2a2314}.guide.warn strong{color:var(--later)}
.past{opacity:.8}.past .game{font-size:1rem}
@media (prefers-reduced-motion:no-preference){.pip{transition:background .2s}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://ogufpaothnrnqzloehgp.supabase.co";
const SUPABASE_KEY = "sb_publishable_gULPbFjTAVgdlNws_JhPTQ_iPkowae7";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
let me = null, P = {}, props = [], R = [], timer = null;

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function put(parent, ...kids) {
  parent.replaceChildren(...kids.flat().filter((c) => c != null && c !== false));
}
function av(p, size = "") {
  const e = h("div", { class: "av " + size });
  if (p && p.avatar && p.avatar.startsWith("data:image/")) e.style.backgroundImage = `url(${p.avatar})`;
  else e.textContent = ((p && p.name) || "?")[0].toUpperCase();
  return e;
}
function toast(msg) {
  const t = h("div", { class: "toast", role: "alert" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 5000);
}
function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" }) + ", " +
    d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
}
function shrink(file, size = 96) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- Start ---------- */
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showJoin();
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) { app.replaceChildren(h("p", {}, "Verbindung fehlgeschlagen. Bitte Seite neu laden.")); return; }
  if (!p || p.removed_at) return showJoin(!!(p && p.removed_at));
  me = p;
  showMain();
}

/* ---------- Push ---------- */
const VAPID_PUBLIC = "BNmbwk2e2TX-y7jL7wpoZuHXEU6RVYOxXCiwlxEmb2xaBn_wAhTBLa6IJUxMLn7989SGopKTE_WAa2snc91ELpc";
function b64ToU8(b) {
  const s = (b + "=".repeat((4 - (b.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}
function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  return Notification.permission; // "default" | "granted" | "denied"
}
async function syncPush() {
  if (pushState() !== "granted") return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.from("push_subscriptions").upsert(
      { endpoint: j.endpoint, user_id: me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: "endpoint" });
    return !error;
  } catch (e) { return false; }
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { drawPush(); return toast("Benachrichtigungen sind nicht erlaubt. Du kannst sie in den Browser-Einstellungen der Seite freigeben."); }
  const ok = await syncPush();
  if (!ok) toast("Die Benachrichtigungen konnten nicht eingerichtet werden. Bitte versuch es noch einmal.");
  drawPush();
}
function drawPush() {
  const box = document.getElementById("pushbox");
  if (!box) return;
  const st = pushState();
  if (st === "granted") return box.replaceChildren();
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const body = [];
  if (st === "unsupported") {
    body.push(h("p", { class: "sub" }, ios
      ? "So bekommst du Benachrichtigungen: Tippe in Safari auf Teilen, dann auf \"Zum Home-Bildschirm\". Öffne Gamevote danach vom Home-Bildschirm aus."
      : "Dieser Browser unterstützt keine Benachrichtigungen. Öffne Gamevote am besten in Chrome."));
  } else if (st === "denied") {
    body.push(h("p", { class: "sub" }, "Benachrichtigungen sind blockiert. Öffne die Einstellungen der Seite in deinem Browser und erlaube sie dort."));
  } else {
    body.push(h("p", { class: "sub" }, "Damit du mitbekommst, wenn jemand zocken will, schalte Benachrichtigungen ein. Es gibt keine Dauer-Nachrichten, nur wenn jemand einen Vorschlag sendet."),
      h("button", { class: "btn small", onclick: enablePush }, "Benachrichtigungen einschalten"));
  }
  box.replaceChildren(h("div", { class: "card push" }, h("strong", {}, "Benachrichtigungen sind aus"), ...body));
}

/* ---------- Installieren ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installEvt = e;
  const b = document.getElementById("installbtn");
  if (b) b.hidden = false;
});
function isStandalone() {
  return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
}
function installGuide(code) {
  if (isStandalone()) return null;
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua);
  const android = /android/i.test(ua);
  if (!ios && !android) return null;
  if (ios) {
    return h("div", { class: "card guide warn", role: "note" },
      h("strong", {}, "⚠ Wichtig: Erst installieren, dann beitreten"),
      h("p", {}, "Wenn du hier in Safari beitrittst und Gamevote danach installierst, bist du in der App wieder abgemeldet und dein Name bleibt blockiert. Benachrichtigungen kommen auf dem iPhone außerdem nur in der installierten App an."),
      h("ol", {},
        h("li", {}, "Tippe in Safari auf Teilen (Quadrat mit Pfeil). Bei manchen iPhones steckt es hinter den drei Punkten."),
        h("li", {}, "Wähle \"Zum Home-Bildschirm\". Falls du ihn nicht siehst, tippe vorher auf \"Mehr\"."),
        h("li", {}, "Tippe auf \"Hinzufügen\"."),
        h("li", {}, "Öffne Gamevote über das neue Symbol auf dem Home-Bildschirm und tritt dort bei.")
      ),
      code ? h("p", { class: "sub" }, "Dein Einladungscode für die App: " + code) : null
    );
  }
  const btn = h("button", { class: "btn small", id: "installbtn", hidden: !installEvt, onclick: async () => {
    if (!installEvt) return;
    installEvt.prompt();
    await installEvt.userChoice;
    installEvt = null;
    btn.hidden = true;
  } }, "Jetzt installieren");
  return h("div", { class: "card guide" },
    h("strong", {}, "Als App installieren"),
    h("p", { class: "sub" }, "So liegt Gamevote auf deinem Startbildschirm. Beitreten kannst du auch ohne Installation."),
    btn,
    h("ol", {},
      h("li", {}, "Tippe in Chrome oben rechts auf die drei Punkte."),
      h("li", {}, "Wähle \"App installieren\" oder \"Zum Startbildschirm hinzufügen\"."),
      h("li", {}, "Bestätige mit \"Installieren\".")
    )
  );
}

/* ---------- Beitritt ---------- */
function showJoin(removed = false) {
  let avatar = null;
  const code = new URLSearchParams(location.search).get("c") || "";
  const name = h("input", { id: "name", maxlength: "30", autocomplete: "off", placeholder: "z. B. Tobias" });
  const codeIn = h("input", { id: "code", value: code, autocomplete: "off", placeholder: "Code aus dem Einladungslink" });
  const prev = h("div", { class: "av l" }, "?");
  const file = h("input", {
    type: "file", accept: "image/*", capture: "user", id: "foto",
    onchange: async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      avatar = await shrink(f);
      prev.textContent = "";
      prev.style.backgroundImage = `url(${avatar})`;
    }
  });
  const go = h("button", { class: "btn", onclick: async () => {
    const n = name.value.trim();
    if (n.length < 2) return toast("Bitte gib einen Namen mit mindestens 2 Zeichen ein.");
    if (!avatar) return toast("Bitte mach ein Foto von dir.");
    if (!codeIn.value.trim()) return toast("Es fehlt der Einladungscode.");
    go.disabled = true;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) { go.disabled = false; return toast("Anmeldung fehlgeschlagen. Bitte später erneut versuchen."); }
    }
    const { error } = await sb.rpc("join_group", { p_name: n, p_avatar: avatar, p_code: codeIn.value.trim() });
    go.disabled = false;
    if (error) {
      if (error.code === "23505") return toast(`Der Name "${n}" ist schon vergeben. Nimm z. B. "${n} 2" oder deinen Nachnamen dazu.`);
      if ((error.message || "").includes("invite")) return toast("Der Einladungscode ist falsch. Frag den Ersteller nach dem aktuellen Link.");
      return toast("Beitritt fehlgeschlagen: " + error.message);
    }
    start();
  } }, "Beitreten");
  put(app,
    h("h1", {}, "Gamevote"),
    h("p", { class: "sub" }, "Wer zockt heute? Gib deinen Namen ein und mach ein Foto, dann bist du dabei."),
    removed ? h("div", { class: "card guide" }, h("p", {}, "Du wurdest aus der Gruppe entfernt. Wenn du wieder mitmachen willst, trag unten deinen Namen ein und mach ein neues Foto.")) : null,
    installGuide(code),
    h("label", { for: "name" }, "Dein Name"), name,
    h("label", { for: "foto" }, "Dein Foto"), prev, file,
    h("p", { class: "sub", style: "margin:-2px 0 14px" }, "Dein Profilbild wird in der Datenbank gespeichert und beim Verlassen der Gruppe gelöscht."),
    code ? null : [h("label", { for: "code" }, "Einladungscode"), codeIn],
    go
  );
}

/* ---------- Hauptansicht ---------- */
function showMain() {
  const form = h("div", { class: "card", hidden: true });
  const games = h("datalist", { id: "games" });
  const gameIn = h("input", { id: "game", list: "games", placeholder: "z. B. Rocket League", maxlength: "60" });
  const timeIn = h("input", { id: "when", type: "datetime-local" });
  const minIn = h("input", { id: "min", type: "number", min: "2", max: "20", value: "2" });
  const d = new Date(); d.setHours(21, 0, 0, 0);
  if (d < new Date()) d.setDate(d.getDate() + 1);
  const pad = (x) => String(x).padStart(2, "0");
  timeIn.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const send = h("button", { class: "btn", onclick: async () => {
    const g = gameIn.value.trim();
    if (!g) return toast("Welches Spiel?");
    if (!timeIn.value) return toast("Bitte eine Uhrzeit angeben.");
    send.disabled = true;
    const { data, error } = await sb.from("proposals").insert({
      creator_id: me.id, game: g, start_time: new Date(timeIn.value).toISOString(), min_players: Math.max(2, +minIn.value || 2)
    }).select("id").single();
    if (error) {
      send.disabled = false;
      return toast(/rate_limit/i.test(error.message || "")
        ? "Du hast in der letzten Stunde schon 3 Vorschläge gesendet. Warte etwas oder hefte eine Notiz an einen deiner Vorschläge."
        : "Vorschlag konnte nicht erstellt werden: " + error.message);
    }
    await sb.from("responses").insert({ proposal_id: data.id, user_id: me.id, answer: "yes" });
    send.disabled = false; form.hidden = true; gameIn.value = "";
    refresh();
  } }, "Vorschlag senden");
  form.append(
    h("label", { for: "game" }, "Spiel"), gameIn, games,
    h("label", { for: "when" }, "Wann?"), timeIn,
    h("label", { for: "min" }, "Mindestens so viele Spieler (du eingerechnet)"), minIn,
    h("div", { class: "row" }, send, h("button", { class: "btn ghost", onclick: () => (form.hidden = true) }, "Abbrechen"))
  );
  app.replaceChildren(
    h("div", { class: "top" },
      h("div", { class: "me" }, myAvatar(), h("div", {}, h("h1", {}, "Gamevote"), h("div", { class: "sub" }, me.name))),
      h("button", { class: "btn", onclick: () => { form.hidden = !form.hidden; } }, "Ich will zocken")
    ),
    h("div", { id: "pushbox" }),
    form,
    h("div", { class: "row", style: "margin:0 0 4px" }, h("button", { class: "btn ghost small", onclick: () => showStats() }, "Statistik"), me.is_admin ? h("button", { class: "btn ghost small", onclick: () => showAdmin() }, "Admin") : null),
    h("div", { id: "list" }),
    h("div", { style: "margin-top:28px;display:flex;gap:10px;justify-content:center" }, h("button", { class: "btn ghost small", onclick: changePhoto }, "Foto ändern"), h("button", { class: "btn ghost small", onclick: leaveGroup }, "Gruppe verlassen"))
  );
  drawPush();
  syncPush();
  refresh();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && !document.querySelector("#list input:focus")) refresh(true); }, 30000);
  if (!window.visHooked) {
    window.visHooked = true;
    document.addEventListener("visibilitychange", () => { if (!document.hidden && document.getElementById("list")) refresh(true); });
  }
}

/* ---------- Statistik ---------- */
const TAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const num = (n) => String(n).replace(".", ",");
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
function bar(frac) {
  const i = h("i");
  i.style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + "%";
  return h("div", { class: "bar", "aria-hidden": "true" }, i);
}
function statRow(label, detail, frac) {
  return h("div", { class: "stat" }, h("div", { class: "line" }, h("span", {}, label), h("span", { class: "sub" }, detail)), bar(frac));
}
function dur(min) {
  return min < 60 ? `${min} Min.` : `${num((min / 60).toFixed(1))} Std.`;
}
function statError(error) {
  const missing = error && (error.code === "PGRST202" || error.code === "42883" || /function/i.test(error.message || ""));
  return h("p", { class: "empty" }, missing
    ? "Die Statistik ist noch nicht eingerichtet. Bitte statistik.sql in Supabase ausführen."
    : "Die Statistik konnte nicht geladen werden. Prüfe deine Verbindung und versuche es noch einmal.");
}
async function showStats(tab = "group") {
  clearInterval(timer);
  const body = h("div", {}, h("p", { class: "empty" }, "Statistik wird geladen …"));
  const tabBtn = (key, label) => h("button", {
    class: "btn small" + (tab === key ? "" : " ghost"), "aria-pressed": String(tab === key),
    onclick: () => { if (tab !== key) showStats(key); }
  }, label);
  app.replaceChildren(
    h("div", { class: "top" }, h("h1", {}, "Statistik " + new Date().getFullYear()), h("button", { class: "btn ghost small", onclick: showMain }, "Zurück")),
    h("div", { class: "row", style: "margin:0 0 6px" }, tabBtn("group", "Gruppe"), tabBtn("mine", "Meine Statistik")),
    body
  );
  if (tab === "mine") {
    const { data: m, error } = await sb.rpc("get_my_stats");
    if (error || !m) return put(body, statError(error));
    if (!m.stimmen && !m.vorschlaege) return put(body, h("p", { class: "empty" }, "Noch keine Daten. Sobald du bei vergangenen Vorschlägen abgestimmt hast, siehst du hier deine Zahlen."));
    return put(body,
      h("h2", {}, "Deine Zusagen"),
      h("div", { class: "card" },
        m.stimmen
          ? statRow(`${m.ja} von ${m.stimmen} Stimmen mit Ja`, `${pct(m.ja, m.stimmen)} %`, m.ja / m.stimmen)
          : h("p", { class: "sub" }, "Du hast bei fremden Vorschlägen noch nicht abgestimmt."),
        h("div", { class: "sub", style: "margin-top:8px" }, `Davon ${m.spaeter}× Später und ${m.nein}× Nein. Eigene Vorschläge zählen nicht mit.`)),
      h("h2", {}, "Deine Vorschläge"),
      h("div", { class: "card" }, h("div", { class: "count" }, `${m.vorschlaege} abgeschlossene Vorschläge von dir`)),
      h("p", { class: "sub" }, "Nur du siehst diese Seite.")
    );
  }
  const { data: s, error } = await sb.rpc("get_stats");
  if (error || !s) return put(body, statError(error));
  const b = s.beteiligung || {};
  if (!b.vorschlaege) return put(body, h("p", { class: "empty" }, "Noch keine abgeschlossenen Vorschläge. Die Statistik füllt sich, sobald die ersten Spielzeiten vorbei sind."));
  const maxInit = Math.max(1, ...s.initiators.map((x) => x.anzahl));
  const maxTag = Math.max(0.1, ...s.tage.map((x) => +x.avg_ja));
  const maxStd = Math.max(0.1, ...s.stunden.map((x) => +x.avg_ja));
  put(body,
    h("h2", {}, "Top-Spiele"),
    h("div", { class: "card" }, s.games.map((g) =>
      statRow(g.game, `${g.vorschlaege}× vorgeschlagen, ${pct(g.steht, g.vorschlaege)} % standen`, g.steht / g.vorschlaege))),
    h("h2", {}, "Wer schlägt am meisten vor"),
    h("div", { class: "card" }, s.initiators.map((x) => statRow(x.name, `${x.anzahl}×`, x.anzahl / maxInit))),
    h("h2", {}, "Beliebteste Tage"),
    h("div", { class: "card" }, s.tage.map((x) => statRow(TAGE[x.tag - 1], `Ø ${num(x.avg_ja)} Zusagen (${x.vorschlaege}×)`, +x.avg_ja / maxTag))),
    h("h2", {}, "Beliebteste Uhrzeiten"),
    h("div", { class: "card" }, s.stunden.map((x) => statRow(`${String(x.stunde).padStart(2, "0")} Uhr`, `Ø ${num(x.avg_ja)} Zusagen (${x.vorschlaege}×)`, +x.avg_ja / maxStd))),
    h("h2", {}, "Beteiligung"),
    h("div", { class: "card" },
      h("div", { class: "count" }, `Ø ${num(b.avg_stimmen)} Stimmen pro Vorschlag, davon Ø ${num(b.avg_ja)} Ja`),
      h("div", { class: "sub", style: "margin-top:6px" }, b.dauer_n >= 5
        ? `Bis das Spiel stand: Ø ${dur(b.dauer_min)} (aus ${b.dauer_n} Vorschlägen)`
        : `Dauer bis das Spiel steht: noch zu wenige Daten (${b.dauer_n} von 5)`))
  );
}

function changePhoto() {
  const old = document.getElementById("photoinp");
  if (old) old.remove();
  const inp = h("input", { type: "file", accept: "image/*", id: "photoinp", style: "display:none" });
  inp.addEventListener("change", async () => {
    const f = inp.files[0];
    inp.remove();
    if (!f) return;
    try {
      const avatar = await shrink(f);
      const { error } = await sb.rpc("set_avatar", { p_avatar: avatar });
      if (error) return toast("Das Foto konnte nicht gespeichert werden.");
      me = { ...me, avatar };
      AV[me.id] = avatar;
      showMain();
    } catch (e) {
      toast("Das Bild konnte nicht gelesen werden. Versuche ein anderes Foto.");
    }
  });
  document.body.append(inp);
  inp.click();
}
function myAvatar() {
  const e = av(me);
  e.style.cursor = "pointer";
  e.setAttribute("role", "button");
  e.setAttribute("tabindex", "0");
  e.setAttribute("aria-label", "Profilbild ändern");
  e.addEventListener("click", changePhoto);
  e.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); changePhoto(); } });
  return e;
}

async function leaveGroup() {
  if (!confirm("Gruppe wirklich verlassen?\n\nDein Name wird frei, dein Foto gelöscht und du bekommst keine Benachrichtigungen mehr. Deine bisherigen Stimmen zählen anonym in der Statistik weiter. Zurück kommst du nur mit dem Einladungslink und einem neuen Profil.")) return;
  const { error } = await sb.rpc("leave_group");
  if (error) return toast(/last admin/i.test(error.message || "")
    ? "Du bist der einzige Admin. Ernenne zuerst jemand anderen."
    : "Verlassen fehlgeschlagen. Versuche es noch einmal.");
  const unsub = async () => {
    try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  };
  await Promise.race([unsub(), new Promise((r) => setTimeout(r, 2000))]);
  await sb.auth.signOut();
  clearInterval(timer);
  me = null;
  showJoin();
}

/* ---------- Admin ---------- */
async function showAdmin(tab = "props", lim = 50) {
  if (!me || !me.is_admin) return showMain();
  clearInterval(timer);
  const body = h("div", {}, h("p", { class: "empty" }, "Wird geladen …"));
  const tabBtn = (key, label) => h("button", {
    class: "btn small" + (tab === key ? "" : " ghost"), "aria-pressed": String(tab === key),
    onclick: () => { if (tab !== key) showAdmin(key); }
  }, label);
  app.replaceChildren(
    h("div", { class: "top" }, h("h1", {}, "Admin"), h("button", { class: "btn ghost small", onclick: showMain }, "Zurück")),
    h("div", { class: "row", style: "margin:0 0 6px" }, tabBtn("props", "Vorschläge"), tabBtn("members", "Mitglieder")),
    body
  );
  const fail = () => put(body, h("p", { class: "empty" }, "Das konnte nicht geladen werden. Prüfe deine Verbindung und versuche es noch einmal."));

  if (tab === "members") {
    const { data, error } = await sb.from("profiles").select("id, name, avatar, is_admin, removed_at, created_at").order("created_at");
    if (error || !data) return fail();
    const active = data.filter((x) => !x.removed_at);
    const gone = data.length - active.length;
    return put(body,
      h("h2", {}, `Mitglieder (${active.length})`),
      active.map((m) => h("div", { class: "card" }, h("div", { class: "head" },
        av(m),
        h("div", { class: "t" }, h("p", { class: "game" }, m.name),
          h("div", { class: "sub" }, (m.is_admin ? "Admin · " : "") + "dabei seit " + new Date(m.created_at).toLocaleDateString("de-DE"))),
        h("div", { class: "acts" },
          m.avatar ? h("button", { class: "btn ghost small", onclick: async () => {
            if (!confirm(`Profilbild von „${m.name}“ zurücksetzen?\n\nDas Foto wird gelöscht, die App zeigt dann nur noch den Anfangsbuchstaben.`)) return;
            const { error: e } = await sb.rpc("reset_avatar", { p_id: m.id });
            if (e) return toast("Zurücksetzen fehlgeschlagen.");
            showAdmin("members");
          } }, "Foto zurücksetzen") : null,
          m.id === me.id ? null : h("button", { class: "btn ghost small", onclick: async () => {
            if (!confirm(`„${m.name}“ entfernen?\n\nDer Name wird frei, das Foto gelöscht und der Zugang gesperrt. Die Statistik bleibt erhalten.`)) return;
            const { error: e } = await sb.rpc("remove_member", { p_id: m.id });
            if (e) return toast("Entfernen fehlgeschlagen.");
            showAdmin("members");
          } }, "Entfernen"))))),
      gone ? h("p", { class: "sub" }, `Entfernte Mitglieder: ${gone}. Ihre Stimmen zählen anonym weiter in der Statistik.`) : null
    );
  }

  const [act, del, pf] = await Promise.all([
    sb.from("proposals").select("id, game, start_time, creator_id").is("deleted_at", null).order("start_time", { ascending: false }).limit(lim),
    sb.from("proposals").select("id, game, start_time, creator_id").not("deleted_at", "is", null).order("deleted_at", { ascending: false }).limit(lim),
    sb.from("profiles").select("id, name")
  ]);
  if (act.error || del.error || pf.error) return fail();
  const name = Object.fromEntries(pf.data.map((x) => [x.id, x.name]));
  const row = (p, restore) => h("div", { class: "card" }, h("div", { class: "head" },
    h("div", { class: "t" }, h("p", { class: "game" }, p.game), h("div", { class: "sub" }, `${fmt(p.start_time)} · von ${name[p.creator_id] || "?"}`)),
    h("div", { class: "acts" },
      h("button", { class: "btn ghost small", onclick: async () => {
        if (!restore && !confirm(`Vorschlag „${p.game}“ löschen?`)) return;
        const { error: e } = await sb.rpc(restore ? "restore_proposal" : "delete_proposal", { p_id: p.id });
        if (e) return toast(restore ? "Wiederherstellen fehlgeschlagen." : "Löschen fehlgeschlagen.");
        showAdmin("props", lim);
      } }, restore ? "Wiederherstellen" : "Löschen"),
      restore ? h("button", { class: "btn danger small", onclick: async () => {
        if (!confirm(`Vorschlag „${p.game}“ endgültig löschen?\n\nDas lässt sich nicht rückgängig machen. Die Statistik ändert sich nicht, weil gelöschte Vorschläge dort ohnehin nicht zählen.`)) return;
        const { error: e } = await sb.rpc("purge_proposal", { p_id: p.id });
        if (e) return toast("Endgültig löschen fehlgeschlagen.");
        showAdmin("props", lim);
      } }, "Endgültig löschen") : null)));
  put(body,
    h("h2", {}, "Aktive Vorschläge"),
    act.data.length ? act.data.map((p) => row(p, false)) : h("p", { class: "empty" }, "Keine aktiven Vorschläge."),
    h("h2", {}, "Gelöschte Vorschläge"),
    del.data.length ? del.data.map((p) => row(p, true)) : h("p", { class: "empty" }, "Keine gelöschten Vorschläge."),
    act.data.length >= lim || del.data.length >= lim
      ? h("button", { class: "btn ghost small", onclick: () => showAdmin("props", lim + 50) }, "Mehr anzeigen") : null
  );
}

const AV_TTL = 10 * 60 * 1000; // Profilfotos höchstens alle 10 Minuten neu laden (spart Datenvolumen)
let AV = {}, avAt = 0;
const VERLAUF_TAGE = 30; // so viele Tage Verlauf zeigt die App (ältere Daten bleiben in der Datenbank)
async function refresh(auto = false) {
  const since = new Date(Date.now() - VERLAUF_TAGE * 864e5).toISOString();
  const [pr, pp] = await Promise.all([
    sb.from("profiles").select("id, name, is_admin, removed_at"), // ohne Fotos: klein und schnell
    // Antworten gleich mitladen: eine Abfrage statt zwei, und keine lange ID-Liste in der URL
    sb.from("proposals").select("*, responses(*)").is("deleted_at", null).gte("start_time", since).order("start_time")
  ]);
  if (pr.error || pp.error) return toast("Daten konnten nicht geladen werden.");
  const mineP = pr.data.find((x) => x.id === me.id);
  if (mineP && mineP.removed_at) { clearInterval(timer); me = null; return showJoin(true); }
  // Fotos nur laden, wenn sie alt sind oder jemand Neues dabei ist
  if (Date.now() - avAt > AV_TTL || pr.data.some((x) => !(x.id in AV))) {
    const pa = await sb.from("profiles").select("id, avatar");
    if (!pa.error && pa.data) { AV = Object.fromEntries(pa.data.map((x) => [x.id, x.avatar])); avAt = Date.now(); }
  }
  if (mineP) me = { ...mineP, avatar: mineP.id in AV ? AV[mineP.id] : (me.avatar ?? null) };
  P = Object.fromEntries(pr.data.map((p) => [p.id, { ...p, avatar: AV[p.id] ?? null }]));
  props = pp.data;
  R = props.flatMap((x) => x.responses || []);
  const dl = document.getElementById("games");
  if (dl) dl.replaceChildren(...[...new Set(props.map((x) => x.game))].map((g) => h("option", { value: g })));
  drawList(auto);
}

function drawList(auto = false) {
  const list = document.getElementById("list");
  if (!list || (auto && document.querySelector("#list input:focus"))) return;
  const now = Date.now() - 2 * 36e5;
  const next = props.filter((x) => +new Date(x.start_time) >= now);
  const past = props.filter((x) => +new Date(x.start_time) < now).reverse();
  put(list,
    h("h2", {}, "Geplant"),
    next.length ? next.map((x) => card(x, false)) : h("p", { class: "empty" }, "Noch nichts geplant. Tipp auf \"Ich will zocken\", um einen Vorschlag zu senden."),
    past.length ? h("h2", {}, `Verlauf der letzten ${VERLAUF_TAGE} Tage`) : null,
    past.map((x) => card(x, true))
  );
}

function card(p, isPast) {
  const rs = R.filter((r) => r.proposal_id === p.id);
  const yes = rs.filter((r) => r.answer === "yes");
  const mine = rs.find((r) => r.user_id === me.id);
  const creator = P[p.creator_id];
  const later = rs.filter((r) => r.answer === "later");
  const steht = yes.length >= p.min_players;
  const slots = Math.max(p.min_players, yes.length + later.length);
  const pips = h("div", { class: "pips", "aria-hidden": "true" });
  for (let i = 0; i < slots; i++) pips.append(h("div", { class: "pip" + (i < yes.length ? " on" : i < yes.length + later.length ? " later" : "") }));

  const el = h("div", { class: "card" + (steht ? " steht" : "") + (isPast ? " past" : "") });
  el.append(
    h("div", { class: "head" }, av(creator), h("div", { class: "t" },
      h("p", { class: "game" }, p.game),
      h("div", { class: "sub" }, `${fmt(p.start_time)} · von ${creator ? creator.name : "?"}`))),
    pips,
    h("div", { class: "count" }, (steht ? `${yes.length} dabei – das Spiel steht` : `${yes.length} von ${p.min_players} Spielern`) + (later.length ? `, ${later.length} später` : ""))
  );
  if (p.pinned_note) el.append(h("div", { class: "pin" }, p.pinned_note));

  if (!isPast) {
    const note = h("input", { class: "note", placeholder: "Notiz, z. B. komme erst gegen 22 Uhr", value: (mine && mine.note) || "", maxlength: "140" });
    const alt = h("input", { class: "alt", placeholder: "Gegenvorschlag, z. B. lieber Minecraft", value: (mine && mine.counter_game) || "", maxlength: "60" });
    const save = async (patch) => {
      const { error } = await sb.from("responses").upsert({
        proposal_id: p.id, user_id: me.id,
        answer: (mine && mine.answer) || "later",
        note: mine ? mine.note : null,
        counter_game: mine ? mine.counter_game : null,
        ...patch, updated_at: new Date().toISOString()
      });
      if (error) return toast("Das konnte nicht gespeichert werden.");
      if (document.activeElement) document.activeElement.blur();
      refresh();
    };
    const btn = (label, key) => h("button", { class: key + (mine && mine.answer === key ? " on" : ""), onclick: () => save({ answer: key }) }, label);
    const ok = (inp, field) => h("button", { class: "btn small", title: "Speichern", "aria-label": "Speichern", onclick: () => save({ [field]: inp.value.trim() || null }) }, "✓");
    el.append(
      h("div", { class: "ans" }, btn("Ja", "yes"), btn("Später", "later"), btn("Nein", "no")),
      h("div", { class: "row2" }, note, ok(note, "note")),
      h("div", { class: "row2" }, alt, ok(alt, "counter_game"))
    );
  }

  if (rs.length) el.append(h("div", { class: "who" }, rs.map((r) => {
    const u = P[r.user_id];
    const col = { yes: "var(--yes)", later: "var(--later)", no: "var(--no)" }[r.answer];
    const dot = h("span", { class: "mark" }); dot.style.background = col;
    return h("div", { class: "w" }, av(u, "s"), h("span", {}, u ? u.name : "?"), dot,
      h("span", { class: "mute" }, [r.note, r.counter_game ? `lieber ${r.counter_game}` : null].filter(Boolean).join(" · ")));
  })));

  if (!isPast && p.creator_id === me.id) {
    el.append(h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "btn ghost small", onclick: async () => {
        const t = prompt("Notiz zum Vorschlag (z. B. neue Uhrzeit). Leer lassen zum Entfernen:", p.pinned_note || "");
        if (t === null) return;
        const { error } = await sb.from("proposals").update({ pinned_note: t.trim() || null }).eq("id", p.id);
        if (error) return toast("Notiz konnte nicht gespeichert werden.");
        refresh();
      } }, "Notiz anheften"),
      h("button", { class: "btn ghost small", onclick: async () => {
        if (!confirm("Diesen Vorschlag löschen?")) return;
        const { error } = await sb.rpc("delete_proposal", { p_id: p.id });
        if (error) return toast("Löschen fehlgeschlagen.");
        refresh();
      } }, "Löschen")));
  }
  return el;
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
